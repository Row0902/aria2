name: Release

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read      # needed for actions/checkout
      id-token: write     # needed for PyPI trusted publishing
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv build
      - run: uv publish
