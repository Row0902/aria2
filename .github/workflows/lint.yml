name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-packages --locked
      - run: uv run ruff check packages/ apps/ tests/ --output-format github
      - run: uv run ruff format --check packages/ apps/ tests/ --quiet
