name: aria2
version: "0.1.0"
description: "Wrapper completo para aria2 en Python 3.14 — cliente JSON-RPC async con WebSocket, tipado estático, manejo de eventos"
python: ">=3.14"
build: uv_build

quality:
  strict_types: true
  strict_docstrings: true
  strict_polymorphic_validation: true
  strict_semantic_version: true
  strict_conventional_commits: true
  strict_changelog: true
  strict_no_third_party_leaks: true
  strict_idempotent_close: true
  strict_async_only: true
  strict_coverage: 80
  strict_deprecation_policy: true
  strict_no_utils: true

  # Lines-of-code strict thresholds
  strict_single_responsibility: true
  max_file_lines: 200
  critical_file_lines: 500
  max_function_lines: 20
  max_class_public_methods: 10

sdd:
  execution: interactive
  artifact_store: openspec
  chained_pr_strategy: ask-always
  strict_tdd: true
  review_budget: 400
