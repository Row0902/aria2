[project]
name = "aria2-sdk"
version = "0.1.0"
description = "The best SDK for aria2 — async JSON-RPC client with WebSocket events and bundled binary"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Rowell Urbaez Reyes", email = "167712855+Row0902@users.noreply.github.com" },
]
keywords = ["aria2", "download", "json-rpc", "async", "sdk", "httpx", "websockets"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.14"
dependencies = ["httpx>=0.28.1", "pydantic>=2.13.4", "websockets>=14.2"]

[project.urls]
repository = "https://github.com/Row0902/aria2"
documentation = "https://github.com/Row0902/aria2#readme"
changelog = "https://github.com/Row0902/aria2/blob/main/CHANGELOG.md"
issues = "https://github.com/Row0902/aria2/issues"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "respx>=0.23.1",
  "ruff>=0.15.15",
  "ty>=0.0.42",
  "typer>=0.26.5",
]

[project.scripts]
aria2 = "aria2.__main__:main"  # package installed as aria2-sdk, import as aria2

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["/src", "/aria2_bin/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/aria2"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["/aria2_bin/**"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["tests/**", "**/__pycache__/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF", "TRY", "PERF", "PT"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["D", "ANN", "N802", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["aria2"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
line-ending = "lf"

[tool.ty]
respect-ignore-files = true

[tool.ty.environment]
python-version = "3.14"
python-platform = "linux"

[tool.ty.rules]
invalid-argument-type = "error"
unresolved-import = "error"
possibly-unresolved-reference = "warn"
redundant-cast = "warn"
unused-awaitable = "error"

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]
log_cli = true
log_cli_level = "INFO"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: requires a running aria2 daemon",
  "network: makes external network calls",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/aria2/bin/*", "**/__main__.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "def __str__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
  "pass",
]
skip_covered = true
show_missing = true
