# Workspace root — virtual workspace (no [project] table)
[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
aria2-sdk = { workspace = true }
aria2-bin = { workspace = true }

# ═══════════════════════════════════════════════════
# Shared tool configuration — applies to all members
# ═══════════════════════════════════════════════════

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "respx>=0.23.1",
  "ruff>=0.15.15",
  "ty>=0.0.42",
  "typer>=0.26.5",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["tests/**", "**/__pycache__/**"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "SIM",
  "C4",
  "RUF",
  "TRY",
  "PERF",
  "PT",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["D", "ANN", "N802", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["aria2", "aria2_bin", "cli"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
line-ending = "lf"

[tool.ty.environment]
python-version = "3.14"
python-platform = "linux"
root = [
  "packages/aria2-sdk/src",
  "packages/aria2-bin/src",
  "apps/cli/src",
]

[tool.ty.rules]
invalid-argument-type = "error"
unresolved-import = "error"
possibly-unresolved-reference = "warn"
redundant-cast = "warn"
unused-awaitable = "error"

[tool.ty.src]
include = [
  "packages/aria2-sdk/src",
  "packages/aria2-bin/src",
  "apps/cli/src",
  "tests",
]

[[tool.ty.overrides]]
include = ["tests/**/*.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "warn"
unused-awaitable = "warn"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
  "tests",
  "packages/aria2-sdk/tests",
  "packages/aria2-bin/tests",
  "apps/cli/tests",
]
filterwarnings = [
  "error",
  # ResourceWarning from subprocess GC cleanup is GC-timing dependent and non-deterministic
  'ignore::ResourceWarning',
]
log_cli = true
log_cli_level = "INFO"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: requires a running aria2 daemon",
  "network: makes external network calls",
]

[tool.coverage.run]
source = [
  "packages/aria2-sdk/src",
  "packages/aria2-bin/src",
  "apps/cli/src",
  "tests",
]
omit = ["**/__main__.py", "**/aria2_bin/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "def __str__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
  "pass",
]
skip_covered = true
show_missing = true
