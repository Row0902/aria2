[project]
name = "aria2-sdk"
version = "0.1.0"
description = "The best SDK for aria2 — async JSON-RPC client with WebSocket events and bundled binary"
readme = "README.md"
authors = [
  { name = "Rowell Urbaez Reyes", email = "167712855+Row0902@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = ["httpx>=0.28.1", "pydantic>=2.13.4", "websockets>=14.2"]

[project.urls]
repository = "https://github.com/Row0902/aria2"
documentation = "https://github.com/Row0902/aria2#readme"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "respx>=0.23.1",
  "ruff>=0.15.15",
  "ty>=0.0.42",
  "typer>=0.26.5",
]

[project.scripts]
aria2 = "aria2.__main__:main"  # package installed as aria2-sdk, import as aria2

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["/src", "/aria2_bin/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/aria2"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["/aria2_bin/**"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
possibly-unresolved-reference = "warn"

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
