[project]
name = "aria2-sdk"
version = "0.1.0"
description = "The best SDK for aria2 — async JSON-RPC client with WebSocket events"
license = "MIT"
authors = [
  { name = "Rowell Urbaez Reyes", email = "167712855+Row0902@users.noreply.github.com" },
]
keywords = [
  "aria2",
  "download",
  "json-rpc",
  "async",
  "sdk",
  "httpx",
  "websockets",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.14"
dependencies = ["httpx>=0.28.1", "pydantic>=2.13.4", "websockets>=14.2"]

[project.urls]
repository = "https://github.com/Row0902/aria2"
documentation = "https://github.com/Row0902/aria2#readme"
changelog = "https://github.com/Row0902/aria2/blob/main/CHANGELOG.md"
issues = "https://github.com/Row0902/aria2/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aria2"]
