[project]
name = "aria2-cli"
version = "0.1.0"
description = "Command-line interface for aria2 download manager"
license = "MIT"
authors = [
  { name = "Rowell Urbaez Reyes", email = "167712855+Row0902@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = ["aria2-sdk", "aria2-bin", "typer>=0.26.5"]

[tool.uv.sources]
aria2-sdk = { workspace = true }
aria2-bin = { workspace = true }

[project.scripts]
aria2 = "cli.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
